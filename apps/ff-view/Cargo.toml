[package]
name = "ff-view"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Low-poly model viewer and browser on crystal-engine"
publish = false
# Two binaries, so `cargo run -p ff-view` needs to know which one is the default.
default-run = "ff-view"

[dependencies]
anyhow = "1"
crystal-engine = { path = "../../crates/crystal-engine" }
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = "0.37"
egui-winit = "0.37"
env_logger = "0.11"
png = "0.17"
pollster = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "30"
winit = "0.30"

# Two binaries share this package's library and its window:
#   ff-view     the viewer: one file, a folder picker, and the CLI
#   ff-browser  the same window with the folder panel always on
[[bin]]
name = "ff-view"
path = "src/main.rs"

[[bin]]
name = "ff-browser"
path = "src/bin/browser.rs"
