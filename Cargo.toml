# rust-dev: one workspace for the rendering, game-dev and asset-extraction apps.
#
# Every app lives in `apps/`; code shared between apps goes in `crates/` once it exists.
# One lockfile and one `target/` serve the whole workspace.
[workspace]
resolver = "3"
members = [
    "apps/cos-convert",
    "apps/cycle-of-steel",
    "apps/ff-export",
    "apps/ff-export-gui",
    "apps/ff-view",
    "crates/crystal-engine",
]
# A plain `cargo build` skips the Slint GUI, as building ff-export's CLI always has.
# Build it with `cargo build -p ff-export-gui`.
default-members = [
    "apps/cos-convert",
    "apps/cycle-of-steel",
    "apps/ff-export",
    "apps/ff-view",
    "crates/crystal-engine",
]

[profile.release]
opt-level = 3
